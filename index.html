<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080909">
  <title>Bugün senin günün ✨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap');
    :root{--cream:#f5f3ef;--pink:#ff9db7;--gold:#d6ff35;--ink:#080909;--muted:#aaa}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-snap-type:y mandatory}body{margin:0;background:#080909;color:var(--cream);font-family:'DM Sans',sans-serif;overflow-x:hidden}section{min-height:100svh;scroll-snap-align:start;display:grid;place-items:center;padding:36px 20px;position:relative;overflow:hidden}.hero{background:#080909}.hero:before,.hero:after{content:'✦';position:absolute;color:#d6ff35;opacity:.7;animation:twinkle 2.2s infinite alternate}.hero:before{top:16%;left:14%;font-size:20px}.hero:after{right:12%;top:30%;font-size:13px;animation-delay:.8s}.hero-content{text-align:center;display:flex;flex-direction:column;align-items:center;gap:15px}.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:.7rem;color:#aaa}.head-wrap{position:relative;margin:0 auto;width:min(63vw,285px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;animation:drop 1.2s cubic-bezier(.2,.85,.25,1) both;outline:none}.head-wrap:before{content:'';position:absolute;inset:-9px;border:1px solid #d6ff356b;border-radius:50%;box-shadow:0 0 60px #d6ff3533}.head-wrap img{width:100%;height:100%;object-fit:cover;object-position:center 38%;border-radius:50%;box-shadow:0 20px 65px #09050d80;transition:transform .3s,filter .3s}.thought{background:#e9ff93;color:#111;padding:11px 18px;border-radius:18px;font-weight:700;position:absolute;right:-28px;top:1%;box-shadow:0 8px 25px #0004;transform:rotate(5deg)}.thought:after{content:'';position:absolute;left:15px;bottom:-10px;border:8px solid transparent;border-top-color:#e9ff93;border-bottom:0}.head-wrap.bump img{transform:scale(1.13) rotate(-3deg);filter:saturate(1.3)}.head-wrap.crack1 img{clip-path:polygon(0 0,100% 0,100% 47%,69% 52%,100% 100%,0 100%);filter:contrast(1.25)}.head-wrap.crack2 img{clip-path:polygon(0 0,42% 0,47% 29%,100% 24%,100% 100%,56% 100%,51% 70%,0 78%);filter:contrast(1.5)}.head-wrap.crack1 img{clip-path:polygon(0 0,100% 0,100% 47%,69% 52%,100% 100%,0 100%);filter:contrast(1.25)}.head-wrap.crack2 img{clip-path:polygon(0 0,42% 0,47% 29%,100% 24%,100% 100%,56% 100%,51% 70%,0 78%);filter:contrast(1.5)}.head-wrap.pop img{animation:crack .7s forwards}.tap-hint{color:#f4dce8;font-size:.91rem}.hero h1,.birthday h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,8vw,4rem);line-height:1.12;margin:0}.scroll-cue{position:absolute;bottom:24px;font-size:.75rem;color:#ddc9e1;animation:float 1.5s infinite alternate}.story{background:#080909}.panel{width:min(850px,100%);text-align:center}.panel h2{font:700 clamp(2rem,7vw,3.5rem) 'Playfair Display',serif;margin:0 0 18px}.panel p{line-height:1.75;color:#efdeef;font-size:1.05rem}.audio-card{max-width:520px;margin:30px auto 0;padding:25px;border:1px solid #ffffff30;border-radius:26px;background:#ffffff0c;backdrop-filter:blur(12px)}.audio-icon{font-size:2.5rem}.audio-card h3{margin:8px}.audio-card p{font-size:.9rem;color:#d6c4db}.audio-placeholder{margin-top:18px;width:100%;height:46px;border-radius:24px;border:1px dashed #e6bad888;display:grid;place-items:center;color:#eedced;font-size:.83rem}.memory-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:26px}.memory{margin:0;transform:rotate(var(--tilt));padding:9px 9px 13px;background:#fff8ed;border-radius:9px;color:#35213c;box-shadow:0 14px 36px #0005;transition:transform .3s}.memory:hover{transform:rotate(0) translateY(-7px)}.memory img{width:100%;height:clamp(155px,35vw,285px);object-fit:cover;border-radius:4px}.memory figcaption{font-family:'Playfair Display',serif;padding-top:8px;font-size:.94rem}.birthday{background:#080909;text-align:center}.birthday h1{color:#ffe3a6;text-shadow:0 5px 36px #ffc56b65}.birthday .sparkle{font-size:3rem;display:block;margin-bottom:16px;animation:float 1.5s infinite alternate}.choices{background:#080909}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:30px}.choice{border:1px solid #ffffff2e;background:#ffffff0c;border-radius:24px;padding:15px;color:var(--cream);font:600 1.05rem 'DM Sans';cursor:pointer;transition:transform .22s,border-color .22s,background .22s}.choice:hover{transform:translateY(-5px);border-color:#ffd27a;background:#ffffff18}.paper-art,.cosmos-art{width:100%;height:180px;border-radius:15px;margin-bottom:12px;display:grid;place-items:center;overflow:hidden}.paper-art{background:linear-gradient(135deg,#ecdcc1,#fff8ed 60%,#d8c5a7)}.sheet{width:105px;height:132px;background:#fffdf8;box-shadow:0 10px 24px #5f493b40;transform:rotate(-6deg);border-radius:4px;padding:18px 13px}.sheet:before{content:'';display:block;height:5px;width:48px;background:#d6c9b7;margin-bottom:14px}.sheet i{display:block;height:3px;background:#ded7ce;margin:9px 0;border-radius:3px}.cosmos-art{background:radial-gradient(circle at 50% 50%,#403779,#14172f 70%,#10101d);position:relative}.planet{width:85px;height:85px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffb2cb,#9a4fa1 44%,#3c276d 75%);box-shadow:0 0 30px #c77aff88;position:relative}.planet:after{content:'';position:absolute;width:130px;height:33px;border:3px solid #f7d5ffb5;border-radius:50%;left:-25px;top:27px;transform:rotate(-22deg)}.star{position:absolute;color:#fff2c8}.result{display:none;text-align:center;max-width:680px;animation:fadein .7s both}.result.show{display:block}.result h2{font:700 clamp(2.3rem,9vw,4.7rem) 'Playfair Display',serif;color:#ffe3a6}.result p{font-size:clamp(1.1rem,4vw,1.45rem);line-height:1.6}.locked{display:none}.locked.show{display:block}.result .ornament{font-size:3rem}.footnote{font-size:.76rem!important;color:#cbbbd0!important;margin-top:25px}@keyframes drop{from{transform:translateY(-110vh) rotate(-8deg);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes pop{0%{transform:scale(1.15)}60%{transform:scale(1.45);opacity:.85;filter:brightness(1.6)}100%{transform:scale(.02);opacity:0}}@keyframes crack{0%{transform:scale(1.12)}25%{transform:scale(1.2) rotate(-4deg);filter:contrast(1.5)}45%{transform:scale(1.16) rotate(4deg);clip-path:polygon(0 0,100% 0,100% 43%,64% 51%,100% 100%,0 100%)}70%{transform:scale(1.24);opacity:.8;filter:brightness(1.7)}100%{transform:scale(.03);opacity:0}}@keyframes crack{0%{transform:scale(1.12)}25%{transform:scale(1.2) rotate(-4deg);filter:contrast(1.5)}45%{transform:scale(1.16) rotate(4deg);clip-path:polygon(0 0,100% 0,100% 43%,64% 51%,100% 100%,0 100%)}70%{transform:scale(1.24);opacity:.8;filter:brightness(1.7)}100%{transform:scale(.03);opacity:0}}@keyframes crack{0%{transform:scale(1.12)}25%{transform:scale(1.2) rotate(-4deg);filter:contrast(1.5)}45%{transform:scale(1.16) rotate(4deg);clip-path:polygon(0 0,100% 0,100% 43%,64% 51%,100% 100%,0 100%)}70%{transform:scale(1.24);opacity:.8;filter:brightness(1.7)}100%{transform:scale(.03);opacity:0}}@keyframes twinkle{from{opacity:.2;transform:scale(.7)}to{opacity:1;transform:scale(1.2)}}@keyframes float{to{transform:translateY(-7px)}}@keyframes fadein{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:600px){section{padding:30px 18px}.memory-grid{gap:8px}.memory{padding:6px 6px 10px}.memory figcaption{font-size:.76rem}.memory img{height:clamp(130px,38vw,190px)}.choice-grid{gap:12px}.paper-art,.cosmos-art{height:135px}.sheet{transform:scale(.8) rotate(-6deg)}.choice{padding:10px;font-size:.95rem}.hero-content{gap:12px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  .memory{background:transparent!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;color:transparent!important}.memory img{border-radius:3px}.memory figcaption{display:none}.music-player{margin:18px auto}.music-player button{background:#d6ff35;color:#080909;border:0;border-radius:999px;padding:14px 24px;font:700 1rem "DM Sans";cursor:pointer}section,.hero,.story,.birthday,.choices{background:#080909!important}#dogum-gunun h1{color:#f5f3ef;text-shadow:none}.memory{background:transparent!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;color:transparent!important}.memory img{border-radius:3px}.memory figcaption{display:none}.music-player{margin:18px auto}.music-player button{background:#d6ff35;color:#080909;border:0;border-radius:999px;padding:14px 24px;font:700 1rem "DM Sans";cursor:pointer}section,.hero,.story,.birthday,.choices{background:#080909!important}#dogum-gunun h1{color:#f5f3ef;text-shadow:none}</style>
</head>
<body>
  <section class="hero" id="baslangic">
    <div class="hero-content">
      <div class="eyebrow">Ne olduğunu merak ediyor musun?</div>
      
      <div class="head-wrap" id="head" role="button" tabindex="0" aria-label="Sürprizi açmak için üç kez dokun">
        <img src="images/memet1.jpeg" alt="Doğum günü sürprizinin kahramanı">
        <span class="thought">Tıkla!</span>
      </div>
      <div class="tap-hint" id="tapHint">Sürprizi açmak için 3 kez tıkla</div>
    </div>
    <div class="scroll-cue" id="scrollCue" hidden>Aşağı kaydır ↓</div>
  </section>
  <section class="story" id="ses">
    <div class="panel">
      
      <h2>Dinle.</h2>
      
      <div class="audio-card">
        <div class="audio-icon">🎧</div>
        
        <audio controls preload="metadata" src="images/voice-message.mp3" aria-label="Dinle" style="width:100%;margin-top:18px"></audio>
      </div>
      <p class="scroll-cue" style="position:static;margin-top:42px">Anılara göz at ↓</p>
    </div>
  </section>
  <section class="story" id="fotograflar">
    <div class="panel">
      <div class="eyebrow" id="faceTitle">KENDİNLE YÜZLEŞ</div>
      
      <div class="memory-grid">
        <figure class="memory" style="--tilt:-3deg"><img src="images/memory-1.jpeg" alt="Birlikte geçirilen güzel bir akşam"><figcaption</figcaption></figure>
        <figure class="memory" style="--tilt:2deg"><img src="images/memory-2.jpeg" alt="Arabada çekilmiş bir arkadaş fotoğrafı"><figcaption</figcaption></figure>
        <figure class="memory" style="--tilt:-1deg"><img src="images/memory-3.jpeg" alt="Sahilde arkadaşlarla bir gün"><figcaption</figcaption></figure>
      </div>
    </div>
  </section>
  <section class="story" id="wrapped"><div class="panel"><img src="images/wrapped.png" alt="Mehmet 24. yıl wrapped" style="width:min(100%,900px);max-height:82svh;object-fit:contain"><div class="music-player"><button id="playAkila" type="button">Oynat</button><audio id="akila" preload="metadata" src="images/akila.mp3"></audio></div></div></section><section class="birthday" id="dogum-gunun">
    <div><span class="sparkle">✦</span><h1 style="font-size:clamp(1.8rem,6vw,3.4rem)">ARTIK HAZIRSIN.<br>SENCE DE DOĞRU KARARI VERMENİN VAKTİ GELMEDİ Mİ?<br><small>MEHMET KESKİN.</small></h1><p class="scroll-cue" style="position:static;margin-top:44px">Sürprizin sonu için ↓</p></div>
  </section>
  <section class="choices" id="secim">
    <div class="panel" id="choicePanel">
      <div class="eyebrow">SON KARAR</div><h2>Seçimini yap.</h2>
      <div class="choice-grid">
        <button class="choice" data-choice="paper" aria-label="Birinci seçenek: kağıt görseli"><div class="paper-art"><div class="sheet"><i></i><i></i><i></i><i></i></div></div>📜</button>
        <button class="choice" data-choice="cosmos" aria-label="İkinci seçenek: kozmos görseli"><div class="cosmos-art"><span class="star" style="top:18%;left:20%">✦</span><span class="star" style="right:18%;bottom:18%">✧</span><div class="planet"></div></div>✦</button>
      </div>
    </div>
    <div class="result" id="result" aria-live="polite"><div class="ornament">✧</div><h2 id="resultTitle"></h2><p id="resultText"></p><div id="confirmButtons" style="display:none;gap:12px;justify-content:center;margin-top:28px"><button class="choice" id="confirmYes">Evet</button><button class="choice" id="confirmNo">Hayır, kararsızım</button></div></div>
  </section>
  <script>
    const head = document.querySelector('#head');
    const hint = document.querySelector('#tapHint');
    const cue = document.querySelector('#scrollCue');
    let taps = 0, opened = false;
    function tapHead(){
      if(opened) return;
      taps++;
      head.classList.remove('bump','crack1','crack2'); void head.offsetWidth; if(taps===1)head.classList.add('crack1'); else if(taps===2)head.classList.add('crack2'); else head.classList.add('bump');
      if(taps < 3){hint.textContent = `Bir daha! (${3-taps})`; return;}
      opened = true; head.classList.remove('bump','crack1','crack2'); head.classList.add('pop'); hint.textContent='Sürpriz açılıyor…';
      setTimeout(()=>{cue.hidden=false;document.querySelector('#ses').scrollIntoView({behavior:'smooth'});},650);
    }
    head.addEventListener('click',tapHead);head.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tapHead()}});
    const result=document.querySelector('#result'), panel=document.querySelector('#choicePanel');
    function showChoice(choice){
      panel.hidden=true;result.classList.add('show');
      document.querySelector('#resultTitle').textContent='SEÇİMİNİN DOĞRU OLDUĞUNA EMİN MİSİN?';
      document.querySelector('#resultText').textContent='';
      const actions=document.querySelector('#confirmButtons');actions.style.display='flex';
      document.querySelector('#confirmYes').onclick=()=>{
        localStorage.setItem('birthdayChoiceFinal',choice);
        document.querySelector('#resultTitle').textContent='';
        document.querySelector('#resultText').textContent=choice==='cosmos'
          ? 'SEÇİMİNİN DOĞRULUĞUNU 18.11.2026 01.01 DE +90 535 362 71 12 ADLI TELEFONDAN GELEN ÇAĞRI SÖYLEYECEK. BEKLE.'
          : 'SEÇİMİN DOĞRU. YENİ BİLGİLER İÇİN 18.11.2026 01.01 DE +90 535 362 71 12 ADLI TELEFONDAN GELECEK ÇAĞRIYI BEKLE.';
        actions.remove();document.querySelectorAll('body > section').forEach(section=>{if(section.id!=='secim')section.hidden=true;});
        document.querySelector('#secim').scrollIntoView({behavior:'smooth'});
      };
      document.querySelector('#confirmNo').onclick=()=>{result.classList.remove('show');panel.hidden=false;};
      document.querySelector('#secim').scrollIntoView({behavior:'smooth'});
    }
    document.querySelectorAll('.choice').forEach(button=>button.addEventListener('click',()=>{
      if(localStorage.getItem('birthdayChoiceFinal'))return;
      showChoice(button.dataset.choice);
    }));
    const saved=localStorage.getItem('birthdayChoiceFinal');if(saved){panel.hidden=true;result.classList.add('show');document.querySelector('#resultTitle').textContent='';document.querySelector('#resultText').textContent=saved==='cosmos'?'SEÇİMİNİN DOĞRULUĞUNU 18.11.2026 01.01 DE +90 535 362 71 12 ADLI TELEFONDAN GELEN ÇAĞRI SÖYLEYECEK. BEKLE.':'SEÇİMİN DOĞRU. YENİ BİLGİLER İÇİN 18.11.2026 01.01 DE +90 535 362 71 12 ADLI TELEFONDAN GELECEK ÇAĞRIYI BEKLE.';document.querySelectorAll('body > section').forEach(section=>{if(section.id!=='secim')section.hidden=true;});}
  </script>
<script>document.querySelector("#playAkila")?.addEventListener("click",async e=>{const a=document.querySelector("#akila"),b=e.currentTarget;if(a.paused){try{await a.play();b.textContent="❚❚ Duraklat"}catch{a.controls=true;b.textContent="Oynat"}}else{a.pause();b.textContent="▶ Akila parçasını oynat"}});</script><script>document.querySelector("#playAkila")?.addEventListener("click",async e=>{const a=document.querySelector("#akila"),b=e.currentTarget;if(a.paused){try{await a.play();b.textContent="❚❚ Duraklat"}catch{a.controls=true;b.textContent="Oynat"}}else{a.pause();b.textContent="▶ Akila parçasını oynat"}});</script></body>
</html>
